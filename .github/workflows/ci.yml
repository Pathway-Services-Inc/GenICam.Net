name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # windows-latest is required because CameraViewer targets net8.0-windows (WPF).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore GenICam.Net.sln

      - name: Build
        run: dotnet build GenICam.Net.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GenICam.Net.sln --configuration Release --no-build --verbosity normal
