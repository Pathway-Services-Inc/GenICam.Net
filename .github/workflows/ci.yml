name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # windows-latest is required because CameraViewer targets net8.0-windows (WPF).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer computes the version from git tags, so the full history
          # (including tags) must be available — a shallow clone would
          # version the build as 0.0.0-alpha and fail the version tests.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore GenICam.Net.sln

      - name: Build
        run: dotnet build GenICam.Net.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GenICam.Net.sln --configuration Release --no-build --verbosity normal
